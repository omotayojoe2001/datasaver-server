<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataSaver Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#333}
/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0f0f23 0%,#1a1a3e 50%,#0D47A1 100%)}
#loginScreen .box{background:#fff;padding:48px 40px;border-radius:16px;width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#loginScreen h1{color:#0f172a;margin-bottom:8px;font-size:26px;font-weight:700}
#loginScreen p{color:#64748b;margin-bottom:28px;font-size:14px}
#loginScreen input{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;margin-bottom:16px;transition:border-color .2s;outline:none}
#loginScreen input:focus{border-color:#1565C0}
#loginScreen button{width:100%;padding:14px;background:linear-gradient(135deg,#1565C0,#0D47A1);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s}
#loginScreen button:hover{transform:scale(1.02)}
#loginScreen button:active{transform:scale(.98)}
#loginError{color:#D32F2F;font-size:13px;margin-top:12px;display:none}
/* LAYOUT */
#app{display:none;height:100vh;overflow:hidden;width:100%}
.sidebar{width:240px;background:linear-gradient(180deg,#0f0f23 0%,#1a1a2e 100%);height:100vh;position:fixed;left:0;top:0;overflow-y:auto;padding-top:20px;z-index:100}
.sidebar .logo{color:#fff;font-size:20px;font-weight:bold;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .logo span{color:#4fc3f7;font-size:11px;display:block;font-weight:normal;margin-top:6px;letter-spacing:1px;text-transform:uppercase}
.sidebar a{display:flex;align-items:center;padding:13px 24px;color:rgba(255,255,255,.55);text-decoration:none;font-size:14px;border-left:3px solid transparent;transition:all .2s;margin:2px 0}
.sidebar a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar a.active{background:rgba(79,195,247,.1);color:#4fc3f7;border-left-color:#4fc3f7}
.sidebar a .icon{width:20px;height:20px;margin-right:12px;display:flex;align-items:center}
.sidebar a .icon svg{width:18px;height:18px}
.sidebar .badge{background:#ef5350;color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;margin-left:auto;font-weight:600}
.main{margin-left:240px;height:100vh;overflow-y:auto;padding:32px 32px 32px 32px;flex:1}
/* HEADER */
.page-header{display:flex;align-items:center;margin-bottom:28px}
.page-header h2{font-size:24px;color:#0f172a;flex:1;font-weight:700}
.page-header .btn{padding:10px 20px;background:linear-gradient(135deg,#1565C0,#0D47A1);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.page-header .btn:hover{opacity:.9}
/* CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#fff;padding:16px 18px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.stat-card .label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat-card .value{font-size:20px;font-weight:700;color:#1a1a2e;margin-top:4px}
.stat-card .value.green{color:#2e7d32}
.stat-card .value.blue{color:#1565C0}
.stat-card .value.orange{color:#e65100}
.stat-card .value.red{color:#c62828}
/* TABLE */
.table-wrap{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);overflow:hidden;margin-bottom:24px;border:1px solid rgba(0,0,0,.04)}
.table-wrap table{width:100%;border-collapse:collapse}
.table-wrap th{background:#f8fafc;padding:14px 16px;text-align:left;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.table-wrap td{padding:14px 16px;border-top:1px solid #f1f5f9;font-size:13px;color:#334155}
.table-wrap tr:hover{background:#f8fafc}
.badge-status{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:bold}
.badge-success{background:#E8F5E9;color:#2E7D32}
.badge-pending{background:#FFF3E0;color:#E65100}
.badge-failed{background:#FFEBEE;color:#C62828}
/* BUTTONS */
.btn-sm{padding:5px 10px;border:none;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer}
.btn-approve{background:#43A047;color:#fff}
.btn-reject{background:#D32F2F;color:#fff}
.btn-edit{background:#1565C0;color:#fff}
.btn-delete{background:#D32F2F;color:#fff}
.btn-credit{background:#43A047;color:#fff}
/* MODAL */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:16px;color:#1a1a2e}
.modal label{display:block;font-size:12px;color:#888;margin-bottom:4px;margin-top:12px}
.modal input,.modal select,.modal textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.modal textarea{height:80px;resize:vertical}
.modal .modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.modal .modal-actions button{padding:10px 20px;border:none;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer}
.modal .modal-actions .btn-save{background:#1565C0;color:#fff}
.modal .modal-actions .btn-cancel{background:#eee;color:#333}
/* FILTERS */
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters select,.filters input{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px}
/* PAGE SECTIONS */
.page{display:none}
.page.active{display:block}
/* PROOF IMAGE */
.proof-img{width:120px;height:80px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid #ddd}
.proof-img:hover{opacity:.8}
/* RESPONSIVE */
.table-wrap{overflow-x:auto}
.empty-state{text-align:center;padding:40px 24px;color:#94a3b8}
.empty-state svg{width:40px;height:40px;margin-bottom:12px;opacity:.4;stroke:#94a3b8;fill:none;stroke-width:1.5}
.empty-state p{font-size:13px;margin-top:4px}
@media(max-width:768px){
  .sidebar{width:60px;padding-top:12px}
  .sidebar .logo,.sidebar a span,.sidebar .badge{display:none}
  .sidebar a{justify-content:center;padding:14px 0}
  .sidebar a .icon{margin:0}
  .main{margin-left:60px;padding:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .stat-card{padding:16px}
  .stat-card .value{font-size:20px}
  .table-wrap table{font-size:12px;min-width:500px}
  .page-header h2{font-size:18px}
  .page-header .btn{padding:8px 14px;font-size:12px}
  .filters{flex-direction:column}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="box">
    <h1>DataSaver Admin</h1>
    <p>Enter admin password to continue</p>
    <input type="password" id="pwInput" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">LOGIN</button>
    <div id="loginError">Incorrect password</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="logo">DataSaver<span>Admin Panel</span></div>
    <a href="#" data-page="dashboard" class="active"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="4" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/></svg></span><span>Dashboard</span></a>
    <a href="#" data-page="users"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></span><span>Users</span></a>
    <a href="#" data-page="transactions"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></span><span>Transactions</span></a>
    <a href="#" data-page="subscriptions"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span><span>Subscriptions</span></a>
    <a href="#" data-page="tasks"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></span><span>Tasks</span></a>
    <a href="#" data-page="submissions"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span><span>Submissions</span><span class="badge" id="pendingBadge">0</span></a>
    <a href="#" data-page="wallet"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 10H18a2 2 0 000 4h4"/></svg></span><span>Wallet</span></a>
    <a href="#" data-page="pricing"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></span><span>Pricing</span></a>
    <a href="#" data-page="settings"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span><span>Settings</span></a>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="main">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-users" class="page"></div>
    <div id="page-transactions" class="page"></div>
    <div id="page-subscriptions" class="page"></div>
    <div id="page-tasks" class="page"></div>
    <div id="page-submissions" class="page"></div>
    <div id="page-wallet" class="page"></div>
    <div id="page-pricing" class="page"></div>
    <div id="page-settings" class="page"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
let ADMIN_PW = '';
const API = '';

// LOGIN
function doLogin() {
  ADMIN_PW = document.getElementById('pwInput').value;
  fetch(API + '/admin/api/dashboard', { headers: { 'x-admin-password': ADMIN_PW } })
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(() => {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      loadPage('dashboard');
    })
    .catch(() => { document.getElementById('loginError').style.display = 'block'; });
}

// NAV
document.querySelectorAll('.sidebar a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('.sidebar a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    const page = a.dataset.page;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    loadPage(page);
  });
});

function loadPage(page) {
  if (page === 'dashboard') loadDashboard();
  else if (page === 'users') loadUsers();
  else if (page === 'transactions') loadTransactions();
  else if (page === 'subscriptions') loadSubscriptions();
  else if (page === 'tasks') loadTasks();
  else if (page === 'submissions') loadSubmissions();
  else if (page === 'wallet') loadWallet();
  else if (page === 'pricing') loadPricing();
  else if (page === 'settings') loadSettings();
}

function api(path, opts = {}) {
  opts.headers = { ...opts.headers, 'x-admin-password': ADMIN_PW, 'Content-Type': 'application/json' };
  return fetch(API + '/admin' + path, opts).then(r => r.json()).catch(() => ({}));
}

function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function hideModal() { document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) hideModal(); });

function fmtDate(d) { if (!d) return '-'; return d.substring(0, 10); }
function fmtMoney(n) { return '₦' + (parseFloat(n) || 0).toLocaleString(); }
function statusBadge(s) {
  if (s === 'success' || s === 'approved' || s === 'claimed') return '<span class="badge-status badge-success">' + s.toUpperCase() + '</span>';
  if (s === 'pending') return '<span class="badge-status badge-pending">PENDING</span>';
  return '<span class="badge-status badge-failed">' + (s || 'unknown').toUpperCase() + '</span>';
}

// ============ DASHBOARD ============
function loadDashboard() {
  api('/api/dashboard').then(d => {
    let recentTxnRows = '';
    if (d.recentTransactions) d.recentTransactions.forEach(t => {
      recentTxnRows += `<tr><td>${fmtDate(t.created_at)}</td><td>${t.phone||'-'}</td><td>${t.type||'-'}</td><td>${t.network||'-'}</td><td>${fmtMoney(t.amount)}</td><td>${statusBadge(t.status)}</td></tr>`;
    });
    let recentUserRows = '';
    if (d.recentUsers) d.recentUsers.forEach(u => {
      recentUserRows += `<tr><td>${u.name||'-'}</td><td>${u.phone||'-'}</td><td>${u.email||'-'}</td><td>${u.subscription_plan||'basic'}</td><td>${fmtDate(u.created_at)}</td></tr>`;
    });
    document.getElementById('page-dashboard').innerHTML = `
      <div class="page-header"><h2>Dashboard</h2></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Total Users</div><div class="value blue">${d.totalUsers||0}</div></div>
        <div class="stat-card"><div class="label">Signups Today</div><div class="value">${d.signupsToday||0}</div></div>
        <div class="stat-card"><div class="label">Active Subscriptions</div><div class="value green">${d.activeSubscriptions||0}</div></div>
        <div class="stat-card"><div class="label">Revenue Today</div><div class="value">${fmtMoney(d.revenueToday)}</div></div>
        <div class="stat-card"><div class="label">Revenue This Week</div><div class="value">${fmtMoney(d.revenueWeek)}</div></div>
        <div class="stat-card"><div class="label">Total Revenue</div><div class="value blue">${fmtMoney(d.revenueTotal)}</div></div>
        <div class="stat-card"><div class="label">Total Deposits</div><div class="value green">${fmtMoney(d.depositsTotal)}</div></div>
        <div class="stat-card"><div class="label">Profit (Deposits - Spent)</div><div class="value orange">${fmtMoney(d.profit)}</div></div>
        <div class="stat-card"><div class="label">Pending Task Reviews</div><div class="value red">${d.pendingTasks||0}</div></div>
      </div>
      <h3 style="margin:24px 0 12px;color:#0f172a">Recent Transactions</h3>
      <div class="table-wrap"><table><tr><th>Date</th><th>Phone</th><th>Type</th><th>Network</th><th>Amount</th><th>Status</th></tr>${recentTxnRows || '<tr><td colspan="6"><div class="empty-state"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><p>No transactions yet — they\'ll appear here when users buy data or airtime</p></div></td></tr>'}</table></div>
      <h3 style="margin:24px 0 12px;color:#0f172a">Recently Onboarded</h3>
      <div class="table-wrap"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Plan</th><th>Joined</th></tr>${recentUserRows || '<tr><td colspan="5"><div class="empty-state"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg><p>No users yet — they\'ll appear here when people sign up on the app</p></div></td></tr>'}</table></div>
    `;
    document.getElementById('pendingBadge').textContent = d.pendingTasks || '0';
  });
}
// ============ USERS ============
let usersPage = 1;
function loadUsers(page) {
  usersPage = page || 1;
  const search = document.getElementById('userSearch') ? document.getElementById('userSearch').value : '';
  api('/api/users?page=' + usersPage + '&search=' + encodeURIComponent(search)).then(d => {
    let rows = '';
    if (d.users) d.users.forEach(u => {
      rows += `<tr>
        <td>${u.name||'-'}</td>
        <td>${u.phone||'-'}</td>
        <td>${u.email||'-'}</td>
        <td>${fmtMoney(u.wallet_balance)}</td>
        <td>${(u.subscription_plan||'basic').toUpperCase()}</td>
        <td>${fmtDate(u.created_at)}</td>
        <td><button class="btn-sm btn-edit" onclick="viewUser('${u.id}')">View</button> <button class="btn-sm btn-delete" onclick="deleteUser('${u.id}','${u.name||u.phone}')">Del</button></td>
      </tr>`;
    });
    const totalPages = Math.ceil((d.total||1) / 50);
    let pagination = '';
    if (totalPages > 1) {
      for (let i = 1; i <= totalPages; i++) {
        pagination += `<button class="btn-sm ${i===usersPage?'btn-edit':''}" onclick="loadUsers(${i})" style="margin:2px">${i}</button>`;
      }
    }
    document.getElementById('page-users').innerHTML = `
      <div class="page-header"><h2>Users (${d.total||0})</h2></div>
      <div class="filters">
        <input type="text" id="userSearch" placeholder="Search name, phone, email..." value="${search}" onkeydown="if(event.key==='Enter')loadUsers(1)">
        <button class="btn-sm btn-edit" onclick="loadUsers(1)">Search</button>
      </div>
      <div class="table-wrap"><table>
        <tr><th>Name</th><th>Phone</th><th>Email</th><th>Wallet</th><th>Plan</th><th>Joined</th><th>Actions</th></tr>
        ${rows || '<tr><td colspan="7"><div class="empty-state"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>No users found</p></div></td></tr>'}
      </table></div>
      <div style="text-align:center">${pagination}</div>
    `;
  });
}

function viewUser(id) {
  api('/api/users/' + id).then(d => {
    const u = d.user;
    let txnRows = '';
    if (d.transactions) d.transactions.forEach(t => {
      txnRows += `<tr><td>${fmtDate(t.created_at)}</td><td>${t.type}</td><td>${t.network||'-'}</td><td>${fmtMoney(t.amount)}</td><td>${statusBadge(t.status)}</td></tr>`;
    });
    let walletRows = '';
    if (d.walletTransactions) d.walletTransactions.forEach(t => {
      walletRows += `<tr><td>${fmtDate(t.created_at)}</td><td>${t.type}</td><td>${fmtMoney(t.amount)}</td><td>${t.description||'-'}</td><td>${statusBadge(t.status||'success')}</td></tr>`;
    });
    let taskRows = '';
    if (d.taskSubmissions) d.taskSubmissions.forEach(t => {
      taskRows += `<tr><td>${fmtDate(t.created_at)}</td><td>${t.task_id?t.task_id.substring(0,8)+'...':'-'}</td><td>${fmtMoney(t.reward)}</td><td>${statusBadge(t.status)}</td></tr>`;
    });
    const photoHtml = u.photo_base64 ? `<img src="data:image/jpeg;base64,${u.photo_base64}" style="width:60px;height:60px;border-radius:50%;object-fit:cover">` : `<div style="width:60px;height:60px;border-radius:50%;background:#1565C0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold">${(u.name||'U').charAt(0).toUpperCase()}</div>`;
    showModal(`
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
        ${photoHtml}
        <div><h3>${u.name||'No Name'}</h3><div style="color:#888;font-size:13px">${u.phone||''} • ${u.email||''}</div></div>
      </div>
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
        <div class="stat-card"><div class="label">Wallet</div><div class="value green" style="font-size:18px">${fmtMoney(u.wallet_balance)}</div></div>

function creditUserPrompt(id) {
  const amt = prompt('Amount to credit (₦):');
  if (!amt || isNaN(amt)) return;
  const desc = prompt('Description (optional):', 'Admin credit');
  api('/api/users/' + id + '/credit', { method: 'POST', body: JSON.stringify({ amount: parseFloat(amt), description: desc }) })
    .then(r => { alert(r.success ? 'Credited! New balance: ' + fmtMoney(r.balance) : r.error); hideModal(); loadUsers(); });
}

function debitUserPrompt(id) {
  const amt = prompt('Amount to debit (₦):');
  if (!amt || isNaN(amt)) return;
  const desc = prompt('Description (optional):', 'Admin debit');
  api('/api/users/' + id + '/debit', { method: 'POST', body: JSON.stringify({ amount: parseFloat(amt), description: desc }) })
    .then(r => { alert(r.success ? 'Debited! New balance: ' + fmtMoney(r.balance) : r.error); hideModal(); loadUsers(); });
}

function changeSubPrompt(id, current) {
  const plan = prompt('New plan (basic, premium, professional, enterprise):', current);
  if (!plan) return;
  let days = 0;
  if (plan !== 'basic') { days = parseInt(prompt('Duration in days:', plan === 'premium' ? '7' : '30')) || 30; }
  api('/api/users/' + id + '/subscription', { method: 'POST', body: JSON.stringify({ plan, days }) })
    .then(r => { alert(r.success ? 'Plan updated!' : r.error); hideModal(); loadUsers(); });
}

function editUserPrompt(id, name, phone, email) {
  showModal(`
    <h3>Edit User</h3>
    <label>Name</label><input id="editName" value="${name}">
    <label>Phone</label><input id="editPhone" value="${phone}">
    <label>Email</label><input id="editEmail" value="${email}">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideModal()">Cancel</button>
      <button class="btn-save" onclick="saveUserEdit('${id}')">Save</button>
    </div>

}

function saveUserEdit(id) {
  const body = { name: document.getElementById('editName').value, phone: document.getElementById('editPhone').value, email: document.getElementById('editEmail').value };
  api('/api/users/' + id + '/update', { method: 'POST', body: JSON.stringify(body) })
    .then(r => { alert(r.success ? 'Updated!' : r.error); hideModal(); loadUsers(); });
}

function deleteUser(id, name) {
  if (!confirm('DELETE user "' + name + '" and ALL their data? This cannot be undone!')) return;
  if (!confirm('Are you REALLY sure?')) return;
  api('/api/users/' + id, { method: 'DELETE' })
    .then(r => { alert(r.success ? 'Deleted!' : r.error); loadUsers(); });
}

function loadSubscriptions() {
  api('/api/subscriptions').then(d => {

      const expired = u.subscription_expires_at && new Date(u.subscription_expires_at) < new Date();

    let histRows = '';
    if (d.history) d.history.forEach(h => {
      totalRev += parseFloat(h.amount || 0);

function doManualTopup() {
  const phone = document.getElementById('topupPhone').value.trim();
  const amount = document.getElementById('topupAmount').value;

  var tabHtml = '<div style="display:flex;gap:0;margin-bottom:16px">' 
    + '<button class="btn-sm ' + (pricingTab==='data'?'btn-edit':'') + '" onclick="pricingTab=\'data\';loadPricing()" style="padding:8px 20px;border-radius:6px 0 0 6px">Data Plans</button>'

  else loadAirtimePricing(tabHtml);

function loadDataPricing(tabHtml) {
  var netFilter = document.getElementById('pricingNet') ? document.getElementById('pricingNet').value : '';
  api('/api/data-plans?network=' + netFilter).then(function(plans) {
    if (!Array.isArray(plans)) plans = [];
    allPlans = plans;
    var rows = '';
    for (var i = 0; i < plans.length; i++) {
      var p = plans[i];
      var cost = parseFloat(p.amount||0);
      var sell = parseFloat(p.selling_price||0);
      var profit = sell - cost;
      var profitColor = profit > 0 ? '#2e7d32' : '#c62828';
      var sellDisplay = sell > 0 ? fmtMoney(sell) : '<span style="color:#e65100">NOT SET</span>';
      rows += '<tr>';
      rows += '<td>' + (p.network||'-') + '</td>';
      rows += '<td>' + (p.size||'-') + '</td>';
      rows += '<td>' + fmtMoney(cost) + '</td>';
      rows += '<td>' + sellDisplay + '</td>';
      rows += '<td style="color:' + profitColor + ';font-weight:bold">' + (sell > 0 ? fmtMoney(profit) : '-') + '</td>';
      rows += '<td>' + (p.data_id||'-') + '</td>';
      rows += '<td>' + (p.active ? '<span style="color:#43A047;font-weight:bold">YES</span>' : '<span style="color:#999">NO</span>') + '</td>';
      rows += '<td>';
      rows += '<button class="btn-sm btn-edit" onclick="editPlan(' + i + ')">Edit</button> ';
      rows += '<button class="btn-sm ' + (p.active?'btn-reject':'btn-approve') + '" onclick="togglePlan(' + i + ')">' + (p.active?'Disable':'Enable') + '</button> ';
      rows += '<button class="btn-sm btn-delete" onclick="deletePlan(' + i + ')">Del</button>';
      rows += '</td></tr>';
    }
    document.getElementById('page-pricing').innerHTML = '<div class="page-header"><h2>Pricing</h2><button class="btn" onclick="createPlanModal()">+ Add Data Plan</button></div>'
      + tabHtml
      + '<div class="filters"><select id="pricingNet" onchange="loadPricing()">'
      + '<option value="">All Networks</option>'
      + '<option value="MTN"' + (netFilter==='MTN'?' selected':'') + '>MTN</option>'
      + '<option value="GLO"' + (netFilter==='GLO'?' selected':'') + '>GLO</option>'
      + '<option value="AIRTEL"' + (netFilter==='AIRTEL'?' selected':'') + '>AIRTEL</option>'
      + '<option value="9MOBILE"' + (netFilter==='9MOBILE'?' selected':'') + '>9MOBILE</option>'
      + '</select></div>'
      + '<div class="table-wrap"><table>'
      + '<tr><th>Network</th><th>Size</th><th>Cost (DataStation)</th><th>Your Selling Price</th><th>Profit</th><th>Plan ID</th><th>Active</th><th>Actions</th></tr>'
      + (rows || '<tr><td colspan="8"><div class="empty-state"><p>No data plans yet</p></div></td></tr>')
      + '</table></div>'
      + '<p style="color:#888;font-size:12px;margin-top:12px"><b>Cost</b> = DataStation price. <b>Selling Price</b> = what you charge users. Set via Edit.</p>';
  });
}

function createPlanModal() {
  showModal('<h3>Add Data Plan</h3>'
    + '<label>Network</label><select id="planNetwork"><option value="MTN">MTN</option><option value="GLO">GLO</option><option value="AIRTEL">AIRTEL</option><option value="9MOBILE">9MOBILE</option></select>'
    + '<label>Size (e.g. 1GB, 500MB)</label><input id="planSize" placeholder="1GB">'
    + '<label>Cost Price - DataStation (\u20a6)</label><input id="planCost" type="number" placeholder="250">'
    + '<label>Your Selling Price (\u20a6)</label><input id="planSell" type="number" placeholder="300">'
    + '<label>DataStation Plan ID</label><input id="planDataId" placeholder="e.g. 1 or 25">'
    + '<div class="modal-actions"><button class="btn-cancel" onclick="hideModal()">Cancel</button><button class="btn-save" onclick="saveNewPlan()">Add Plan</button></div>'
  );
}

function saveNewPlan() {
  var body = {
    network: document.getElementById('planNetwork').value,
    size: document.getElementById('planSize').value,
    amount: parseFloat(document.getElementById('planCost').value) || 0,
    selling_price: parseFloat(document.getElementById('planSell').value) || 0,
    data_id: document.getElementById('planDataId').value,
    active: true
  };
  if (!body.size || !body.amount) { alert('Size and cost price required'); return; }
  api('/api/data-plans', { method: 'POST', body: JSON.stringify(body) })
    .then(function(r) { if (r.success) { hideModal(); loadPricing(); } else alert(r.error||'Failed'); });
}

function editPlan(idx) {
  var p = allPlans[idx];
  if (!p) return;
  showModal('<h3>Edit Data Plan</h3>'
    + '<label>Network</label><select id="planNetwork"><option value="MTN"' + (p.network==='MTN'?' selected':'') + '>MTN</option><option value="GLO"' + (p.network==='GLO'?' selected':'') + '>GLO</option><option value="AIRTEL"' + (p.network==='AIRTEL'?' selected':'') + '>AIRTEL</option><option value="9MOBILE"' + (p.network==='9MOBILE'?' selected':'') + '>9MOBILE</option></select>'
    + '<label>Size</label><input id="planSize" value="' + (p.size||'') + '">'
    + '<label>Cost Price - DataStation (\u20a6)</label><input id="planCost" type="number" value="' + (p.amount||0) + '">'
    + '<label>Your Selling Price (\u20a6)</label><input id="planSell" type="number" value="' + (p.selling_price||0) + '">'
    + '<label>DataStation Plan ID</label><input id="planDataId" value="' + (p.data_id||'') + '">'
    + '<div class="modal-actions"><button class="btn-cancel" onclick="hideModal()">Cancel</button><button class="btn-save" onclick="updatePlan(' + idx + ')">Save</button></div>'
  );
}

function updatePlan(idx) {
  var p = allPlans[idx];
  if (!p) return;
  var body = {
    network: document.getElementById('planNetwork').value,
    size: document.getElementById('planSize').value,
    amount: parseFloat(document.getElementById('planCost').value) || 0,
    selling_price: parseFloat(document.getElementById('planSell').value) || 0,
    data_id: document.getElementById('planDataId').value
  };
  api('/api/data-plans/' + p.id, { method: 'POST', body: JSON.stringify(body) })
    .then(function(r) { if (r.success) { hideModal(); loadPricing(); } else alert(r.error||'Failed'); });
}

function togglePlan(idx) {
  var p = allPlans[idx];
  if (!p) return;
  api('/api/data-plans/' + p.id, { method: 'POST', body: JSON.stringify({ active: !p.active }) })
    .then(function(r) { if (r.success) loadPricing(); else alert(r.error||'Failed'); });
}

function deletePlan(idx) {
  var p = allPlans[idx];
  if (!p) return;
  if (!confirm('Delete this data plan?')) return;
  api('/api/data-plans/' + p.id + '/delete', { method: 'POST' })
    .then(function(r) { if (r.success) loadPricing(); else alert(r.error||'Failed'); });
}

          <input id="setProPrice" value="${s.professional_price||'1500'}" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:4px">
          <label style="display:block;font-size:12px;color:#888;margin-bottom:4px">Professional Duration (days)</label>
          <input id="setProDays" value="${s.professional_duration||'30'}" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:12px">
          <label style="display:block;font-size:12px;color:#888;margin-bottom:4px">Enterprise Price (₦)</label>
          <input id="setEntPrice" value="${s.enterprise_price||'5000'}" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:4px">
          <label style="display:block;font-size:12px;color:#888;margin-bottom:4px">Enterprise Duration (days)</label>
          <input id="setEntDays" value="${s.enterprise_duration||'30'}" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:12px">
        </div>
        <div class="table-wrap" style="padding:24px;margin-top:16px">

          <label style="display:block;font-size:12px;color:#888;margin-bottom:4px">Announcement Text (shown to all users, leave empty to hide)</label>
          <textarea id="setAnnouncement" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;height:80px">${s.announcement||''}</textarea>
        </div>
        <div class="table-wrap" style="padding:24px;margin-top:16px">
          <h3 style="margin-bottom:16px">Admin Security</h3>
          <label style="display:block;font-size:12px;color:#888;margin-bottom:4px">Change Admin Password</label>
          <input id="setNewPassword" type="password" placeholder="New password (leave empty to keep current)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px">
        </div>
        <button class="btn" style="margin-top:20px;width:100%;padding:14px" onclick="saveSettings()">Save All Settings</button>
      </div>
    `;
  });
}

function saveSettings() {
  const settings = {
    premium_price: document.getElementById('setPremPrice').value,
    premium_duration: document.getElementById('setPremDays').value,
    professional_price: document.getElementById('setProPrice').value,
    professional_duration: document.getElementById('setProDays').value,
    enterprise_price: document.getElementById('setEntPrice').value,
    enterprise_duration: document.getElementById('setEntDays').value,
    announcement: document.getElementById('setAnnouncement').value
  };
  const newPw = document.getElementById('setNewPassword').value;
  if (newPw) settings.admin_password = newPw;
  api('/api/settings', { method: 'POST', body: JSON.stringify(settings) })
    .then(r => {
      if (r.success) {
        alert('Settings saved!');
        if (newPw) { ADMIN_PW = newPw; alert('Admin password changed. Use new password next time.'); }
      } else alert(r.error || 'Failed');
    });
}
